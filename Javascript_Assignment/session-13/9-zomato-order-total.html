<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Zomato Order Total</h1>
    <script>
      function getOrderTotal(items) {
        let total = 0;
        items.forEach((item) => {
          if (item.price < 0) {
            throw new Error("Invalid item price");
          }
          total += item.price;
        });
        return total;
      }
      const items = [
        { name: "Pizza", price: 299 },
        { name: "Burger", price: 149 },
        { name: "Fries", price: 50 },
      ];
      try {
        const total = getOrderTotal(items);
        console.log("Order Total: ₹" + total);
      } catch (error) {
        console.log("Sorry, there was a problem with your order.");
        console.log(error.message);
      }
    </script>
  </body>
</html>
