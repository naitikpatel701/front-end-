<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Custom Error Stack Trace</h1>
    <script>
     
      function checkPaymentAmount(amount) {
        if (amount <= 0) {
          throw new Error("Amount must be positive");
        }
        return "Payment accepted";
      }
      try {
        console.log(checkPaymentAmount(150));
      } catch (error) {
        console.error(error);
      }
    </script>
  </body>
</html>
