<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>If-Else Statement</h1>
    <script>
        function showDiscountTag(price){

            if(price<500){
                console.log('Special Discount');
            }
            else{
                console.log('Regular Price');
                
            }
        }

        showDiscountTag(600)
    </script>
</body>
</html>
