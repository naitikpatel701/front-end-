<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2 id="message"></h2>

    <script>
      setTimeout(function () {
        document.getElementById("message").innerText = "Loading your feed...";

        setTimeout(function () {
          document.getElementById("message").innerText = "Feed loaded!";
        }, 2000);
      }, 2000);
    </script>
  </body>
</html>
