<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Filter Example</h1>
    <script>
      const products = [
        {
          name: "iPhone 15",
          price: 69999,
        },
        {
          name: "Samsung Galaxy S24",
          price: 74999,
        },
        {
          name: "OnePlus 12",
          price: 59999,
        },
        {
          name: "iPhone 15 Pro",
          price: 99999,
        },
      ];

      // Callback version
      function searchProductsCallback(searchTerm, callback) {
        setTimeout(function () {
          const result = products.filter(function (product) {
            return product.name
              .toLowerCase()
              .includes(searchTerm.toLowerCase());
          });

          callback(result);
        }, 1000);
      }

      searchProductsCallback("iPhone", function (result) {
        console.log("Callback Result:");
        console.log(result);
      });

      // Promise version
      function searchProductsPromise(searchTerm) {
        return new Promise(function (resolve) {
          setTimeout(function () {
            const result = products.filter(function (product) {
              return product.name
                .toLowerCase()
                .includes(searchTerm.toLowerCase());
            });

            resolve(result);
          }, 1000);
        });
      }

      searchProductsPromise("Samsung").then(function (result) {
        console.log("Promise Result:");
        console.log(result);
      });
    </script>
  </body>
</html>
