<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    
function createPlaylistButton(songName, themeColor){

    let button=document.createElement("button");

    button.innerText=songName;

    button.style.backgroundColor=themeColor;
    button.style.color="white";
    button.style.padding="10px 20px";
    button.style.margin="10px";
    button.style.border="none";
    button.style.borderRadius="5px";

    return button;

}

document.body.appendChild(createPlaylistButton("Kesariya","orange"));
document.body.appendChild(createPlaylistButton("Believer","green"));
document.body.appendChild(createPlaylistButton("Perfect","blue"));

</script>
</body>
</html>
