<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 400px;
            width: 100%;
            margin: 20px 0px;
        }

        .box0 {
            background-color: aqua;
        }

        .box1 {
            /* background: linear-gradient(to bottom right, bule, white); */
            background: linear-gradient(to bottom right,blue,white);
        }

        .box2 {
            /* background: radial-gradientP(bule 40%, white); */
            background: radial-gradient(blue 40% ,white);
        }

        .box3 {
            background: conic-gradient(blue 30%, rgb(51, 136, 141) 30%, white);
        }
    </style>
</head>

<body>
    <div class="box box0"></div>
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
</body>

</html>
