<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #first::first-letter{
            font-size: 30px;
            color: blue;
        }
        h1::before{
            content: "☆";
        }
        h1::after{
            content: "☆";
        }
        li::marker{
            color: green;
        }
       #first::selection{
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Pseudo-Elements</h1>
    <p id="first">Lorem ipsum dolor sit amet consectetur adipisicing elit. Impedit beatae rem suscipit illo fugiat consectetur at perferendis culpa est nemo porro atque qui debitis sunt maiores vel, asperiores natus delectus!</p>
    <ul>
        <li>item-1</li>
        <li>item-2</li>
        <li>item-3</li>
        <li>item-4</li>
        <li>item-5</li>
    </ul>
</body>
</html>
