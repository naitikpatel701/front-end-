<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Contact Form</title>

    <!-- External CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="form-container">
        <h2 id="form-title">Contact Form</h2>

        <form>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" class="input-field" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" class="input-field" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea class="input-field" rows="5" placeholder="Enter your message"></textarea>
            </div>

            <button type="submit" id="submit-btn">Submit</button>
        </form>
    </div>

</body>
</html>
