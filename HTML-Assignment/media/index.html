<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Webpage</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <nav class="navbar">
        <h1 class="logo">My Website</h1>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    
    <section class="content">

       
        <div class="column">
            <h2>Left Column</h2>

            <p>
                This is the left content section.
                The layout becomes responsive using media queries.
            </p>
        </div>

       
        <div class="column">
            <h2>Right Column</h2>

            <p>
                On smaller screens, both columns stack vertically
                for better readability on mobile devices.
            </p>
        </div>

    </section>

    <footer class="footer">
        <p>© 2026 Responsive Website</p>
    </footer>

</body>
</html>
