<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="heading">Product Cards Grid</h1>

    <div class="product-grid">

        
        <div class="card">
            <img src="smartwatch.jpg"
                 alt="Product 1">

            <h2>Smart Watch</h2>
            <p class="price">₹2,999</p>
        </div>

       
        <div class="card">
            <img src="headphone.jpg"
                 alt="Product 2">

            <h2>Wireless Headphones</h2>
            <p class="price">₹1,499</p>
        </div>
 
       
        <div class="card">
            <img src="gaming mouse.jpg"
                 alt="Product 3">

            <h2>Gaming Mouse</h2>
            <p class="price">₹899</p>
        </div>

       
        <div class="card">
            <img src="laptop stand.jpg"
                 alt="Product 4">

            <h2>Laptop Stand</h2>
            <p class="price">₹1,299</p>
        </div>

       
        <div class="card">
            <img src="bluetooth speaker.webp"
                 alt="Product 5">

            <h2>Bluetooth Speaker</h2>
            <p class="price">₹2,199</p>
        </div>

       
        <div class="card">
            <img src="keyboard.jpg"
                 alt="Product 6">

            <h2>Keyboard</h2>
            <p class="price">₹1,099</p>
        </div>

      
        <div class="card">
            <img src="phonecover.jpg"
                 alt="Product 7">

            <h2>Phone Cover</h2>
            <p class="price">₹499</p>
        </div>

        
        <div class="card">
            <img src="powerbank.jpg"
                 alt="Product 8">

            <h2>Power Bank</h2>
            <p class="price">₹1,799</p>
        </div>

       
        <div class="card">
            <img src="usb hub.jpg"
                 alt="Product 9">

            <h2>USB Hub</h2>
            <p class="price">₹699</p>
        </div>

    </div>

</body>
</html>
