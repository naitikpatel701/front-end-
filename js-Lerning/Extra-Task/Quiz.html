<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java Quiz App</title>
    <script src="style.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 800px;
        max-width: 100%;
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        max-height: 90vh;
        overflow-y: auto;
      }

      #progress {
        font-size: 18px;
        margin-bottom: 15px;
        font-weight: bold;
        color: #555;
      }

      #question {
        margin-bottom: 20px;
      }

      .option {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin: 10px 0;
        cursor: pointer;
        transition: 0.3s;
      }

      .option:hover {
        background: #f3f3f3;
      }

      .option.selected {
        background: #dbeafe;
        border: 2px solid #0d6efd;
      }

      button {
        margin-top: 15px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #28a745;
        color: white;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        opacity: 0.9;
      }

      #timer {
        background: red;
        color: white;
        padding: 5px 12px;
        border-radius: 20px;
      }

      .result-card {
        margin: 15px 0;
        padding: 15px;
        border-radius: 10px;
      }

      .correct {
        background: #d4edda;
      }

      .wrong {
        background: #f8d7da;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="progress"></div>

      <h2 id="question"></h2>

      <div id="options"></div>

      <button id="nextBtn" onclick="nextQuestion()">Next Question</button>

      <h3 style="margin-top: 20px">
        Time Left:
        <span id="timer">10:00</span>
      </h3>
    </div>

    <script>
      let counter = 0;
      let score = 0;
      let timeLeft = 600;
      let userAnswers = [];

      function loadQuestion() {
        let questionData = quizQuestions[counter];
        let question = questionData.question;
        let a = questionData.options[0];
        let b = questionData.options[1];
        let c = questionData.options[2];
        let d = questionData.options[3];
        document.getElementById("question").innerHTML = question;
        document.getElementById("options").innerHTML =
          `<input type="radio" name="answer" value="${a}">${a}<br> 
         <input type="radio" name="answer" value="${b}">${b}<br> 
         <input type="radio" name="answer" value="${c}">${c}<br> 
         <input type="radio" name="answer" value="${d}">${d}<br> `;
      }

      function nextQuestion() {
        let selected = document.querySelector('input[name="answer"]:checked');

        if (!selected) {
          alert("Please select an answer");
          return;
        }

        userAnswers.push(selected.value);

        if (selected.value === quizQuestions[counter].answer) {
          score++;
        }

        counter++;

        if (counter < quizQuestions.length) {
          loadQuestion();
        } else {
          showResult();
        }
      }

      function showResult() {
        let percentage = ((score / quizQuestions.length) * 100).toFixed(2);

        let resultHtml = ` <h2>Quiz Completed</h2>

        <h3>Score:${score} / ${quizQuestions.length}</h3>

        <h3>Percentage : ${percentage}%</h3>

        <hr>

        <h2>Answer Review</h2>`;

        for (let i = 0; i < quizQuestions.length; i++) {
          let correct = userAnswers[i] === quizQuestions[i].answer;

          resultHtml += `
             <div style="margin: 10px; padding: 10px; border: 1px solid #ccc;">
            
                <p><b>q${i + 1}:</b>
                ${quizQuestions[i].question}</p>

                <p>Your Answer:${correct ? "true" : "false"}
                    ${userAnswers[i]}</p>
                <p>Correct Answer:${quizQuestions[i].answer}</p>
    </div>
            `;
        }

        resultHtml += ` <button onclick="location.reload()">Restart Quiz</button>`;

        document.querySelector(".container").innerHTML = resultHtml;
      }

      function startTimer() {
        const timerInterval = setInterval(() => {
          let minutes = Math.floor(timeLeft / 60);
          let seconds = timeLeft % 60;

          document.getElementById("timer").innerHTML =
            `${minutes}:${seconds < 10 ? "0" + seconds : seconds}`;
          timeLeft--;

          if (timeLeft < 0) {
            clearInterval(timerInterval);

            alert("Time's Up!");

            showResult();
          }
        }, 1000);
      }

      loadQuestion();
      startTimer();
    </script>
  </body>
</html>
