<!DOCTYPE html>
<html>
<head>
    <title>Document</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 100px;
        }

        #count {
            font-size: 40px;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 20px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Counter App</h1>

    <button onclick="decrement()">-</button>

    <span id="count">0</span>

    <button onclick="increment()">+</button>

    <script>
        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrement() {
            count--;
            document.getElementById("count").innerText = count;
        }
    </script>

</body>
</html>
