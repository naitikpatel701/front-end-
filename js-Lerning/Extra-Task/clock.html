<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 600px;
      }
      .box {
        height: 200px;
        width: 200px;
        border-radius: 50px;
        background-color: black;
        color: white;
        font-size: 2rem;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="box" id="box"></div>
    <script>
      function ClockShow() {
        let date = new Date();
        let newDate = `${date.getHours()}:${date.getMinutes()}:${date.getSeconds()}`;
        document.getElementById("box").textContent = newDate;
      }
      ClockShow();
      setInterval(ClockShow, 1000);
    </script>
  </body>
</html>
