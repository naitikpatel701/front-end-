<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <button onclick="alertExmple()">Alert Exmple</button>
   <button onclick="PromptExmple()">Prompt Exmple</button>
   <button onclick="ConfirmExmple()">Confirm Exmple</button> 

   <script>
    function alertExmple(){
        alert('welcome to js tutorials');
    }

    function PromptExmple(){
        let qty=prompt('enter quantity');
        alert(qty);
    }

    function ConfirmExmple(){
        let ans=confirm('went to delete items');
        alert(ans);
    }
       </script>
</body>
</html>
