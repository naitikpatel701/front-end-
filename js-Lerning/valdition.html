<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3>User Registration Form</h3>
        </div>

        <div class="card-body">
            <form  method="post" id="submit">

                <div class="mb-3" id="userDiv">
                    <label class="form-label">Username</label>
                    <input id="username" type="text" class="form-control" name="username" placeholder="Enter Username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" placeholder="Enter Email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Enter Password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" name="phone" placeholder="Enter Phone Number" required>
                </div>

                <button type="submit" class="btn btn-success">
                    Register
                </button>


            </form>
        </div>
    </div>
</div>

</body>
</html>
